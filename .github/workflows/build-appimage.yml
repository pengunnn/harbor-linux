name: Build Harbor AppImage

on:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable Harbor commit to build.
        required: true
        type: string
      source_repository:
        description: Harbor source repository to build.
        required: false
        default: Harborofficial/Harbor
        type: string
      tag:
        description: Release tag that will receive the generated assets.
        required: true
        type: string
      version:
        description: Harbor package version.
        required: true
        type: string
      channel:
        description: Release channel.
        required: true
        type: string
      publish_release:
        description: Attach the generated AppImage assets to the specified existing release.
        required: false
        default: false
        type: boolean
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: Private key used to sign AppImage updates.
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: Password protecting the updater private key.
        required: true
  workflow_dispatch:
    inputs:
      source_ref:
        description: Harbor commit or ref to build.
        required: true
        type: string
      source_repository:
        description: Harbor source repository to build.
        required: false
        default: Harborofficial/Harbor
        type: string
      tag:
        description: Release tag that will receive the generated assets.
        required: true
        type: string
      version:
        description: Harbor package version. Leave blank to read it from the source ref.
        required: false
        type: string
      channel:
        description: Release channel.
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      publish_release:
        description: Attach generated AppImage assets to the specified existing release.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: harbor-appimage-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build experimental portable AppImage on Arch
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 150
    outputs:
      source_ref: ${{ steps.package.outputs.source_ref }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout packaging workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Arch build dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            alsa-lib base-devel ca-certificates cmake curl ffmpeg git gstreamer \
            gst-libav gst-plugins-bad gst-plugins-base gst-plugins-good \
            gtk3 libayatana-appindicator librsvg mpv nodejs npm openssl \
            jq patchelf pkgconf rust webkit2gtk-4.1 yt-dlp zsync
          npm install --global pnpm@11.9.0

      - name: Checkout Harbor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          path: harbor
          fetch-depth: 1

      - name: Resolve source and package version
        id: package
        working-directory: harbor
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION}"
          if [ -z "${version}" ]; then
            version="$(node -p "require('./package.json').version")"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "source_ref=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Prepare Harbor workspace
        working-directory: harbor
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('fs');
          const workspacePath = 'pnpm-workspace.yaml';
          let workspace = fs.readFileSync(workspacePath, 'utf8');
          const setAllowBuild = (name, value) => {
            const entry = new RegExp(`^(\\s*)${name}:.*$`, 'm');
            if (entry.test(workspace)) {
              workspace = workspace.replace(entry, `$1${name}: ${value}`);
              return;
            }
            if (/^allowBuilds:\s*$/m.test(workspace)) {
              workspace = workspace.replace(/^allowBuilds:\s*$/m, `allowBuilds:\n  ${name}: ${value}`);
              return;
            }
            workspace += `${workspace.endsWith('\n') || !workspace ? '' : '\n'}allowBuilds:\n  ${name}: ${value}\n`;
          };
          setAllowBuild('esbuild', 'true');
          setAllowBuild('protobufjs', 'false');
          fs.writeFileSync(workspacePath, workspace);
          EOF
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
          if node -e "process.exit(require('./package.json').scripts?.setup ? 0 : 1)"; then
            pnpm run setup
          else
            if node -e "process.exit(require('./package.json').scripts?.['setup:fonts'] ? 0 : 1)"; then pnpm run setup:fonts; fi
            mkdir -p src-tauri/binaries
            ln -sf /usr/bin/ffmpeg src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
            ln -sf /usr/bin/ffprobe src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
            ln -sf /usr/bin/yt-dlp src-tauri/binaries/yt-dlp-x86_64-unknown-linux-gnu
          fi

      - name: Install experimental Tauri bundler
        run: |
          set -euo pipefail
          cargo install tauri-cli \
            --git https://github.com/tauri-apps/tauri \
            --rev 162626969b382d52faebdf6c7264460bd9a47d1f \
            --locked \
            --root "${RUNNER_TEMP}/tauri-cli"
          echo "${RUNNER_TEMP}/tauri-cli/bin" >> "${GITHUB_PATH}"

      - name: Configure experimental AppImage
        id: appimage
        working-directory: harbor
        env:
          CHANNEL: ${{ inputs.channel }}
          LINUX_UPDATER_PUBLIC_KEY: ${{ vars.LINUX_UPDATER_PUBLIC_KEY }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('fs');
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (config.bundle?.linux?.appimage?.bundleMediaFramework !== true) {
            throw new Error('The selected Harbor source does not enable AppImage media-framework bundling.');
          }
          const updaterPublicKey =
            process.env.LINUX_UPDATER_PUBLIC_KEY?.trim();

          if (!updaterPublicKey) {
            throw new Error('Missing LINUX_UPDATER_PUBLIC_KEY repository variable.');
          }

          config.bundle.createUpdaterArtifacts = true;
          config.plugins ??= {};
          config.plugins.updater ??= {};
          config.plugins.updater.pubkey = updaterPublicKey;
          const channel = process.env.CHANNEL;
          const repository = process.env.UPDATE_REPOSITORY;

          if (!['stable', 'beta'].includes(channel)) {
            throw new Error(`Unsupported update channel: ${channel}`);
          }

          if (!repository || !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) {
            throw new Error('Invalid UPDATE_REPOSITORY.');
          }

          config.plugins.updater.endpoints = [
            `https://github.com/${repository}/releases/download/updater-test-${channel}/latest.json`,
          ];

          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          EOF
          release="updater-test-${CHANNEL}"
          update_owner="${UPDATE_REPOSITORY%%/*}"
          update_repo="${UPDATE_REPOSITORY#*/}"
          echo "upinfo=gh-releases-zsync|${update_owner}|${update_repo}|${release}|Harbor_*_amd64.AppImage.zsync" >> "${GITHUB_OUTPUT}"

      - name: Build AppImage
        working-directory: harbor
        env:
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: "true"
          UPINFO: ${{ steps.appimage.outputs.upinfo }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_HARBOR_LINUX_UPDATE_CHANNEL: ${{ inputs.channel }}
          VITE_HARBOR_LINUX_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY secret." >&2
            exit 1
          fi
          timeout --signal=TERM 90m cargo tauri build --target x86_64-unknown-linux-gnu --bundles appimage

      - name: Collect AppImage artifacts
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          appimage="$(find harbor/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "${appimage}"
          zsync="${appimage}.zsync"
          signature="${appimage}.sig"
          test -f "${zsync}"
          test -s "${signature}" || {
            echo "Expected a nonempty AppImage updater signature: ${signature}" >&2
            exit 1
          }

          mkdir dist
          cp "${appimage}" "${zsync}" "${signature}" dist/
          (
            cd dist
            sha256sum ./*.AppImage ./*.AppImage.zsync ./*.AppImage.sig \
              > SHA256SUMS-appimage.txt
          )
          jq -n \
            --arg source_ref "${{ steps.package.outputs.source_ref }}" \
            --arg version "${VERSION}" \
            --arg appimage "$(basename "${appimage}")" \
            --arg zsync "$(basename "${zsync}")" \
            --arg signature "$(basename "${signature}")" \
            '{source_ref: $source_ref, version: $version, artifacts: [$appimage, $zsync, $signature]}' \
            > dist/build-manifest.json

      - name: Generate AppImage update manifest
        env:
          VERSION: ${{ steps.package.outputs.version }}
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          actual_version="$(jq -er '.version' harbor/src-tauri/tauri.conf.json)"
          if [ "${VERSION}" != "${actual_version}" ]; then
            echo "Requested version ${VERSION} differs from app version ${actual_version}." >&2
            exit 1
          fi

          test -n "${TAG}"

          appimage="$(jq -er '.artifacts[0]' dist/build-manifest.json)"
          signature="dist/${appimage}.sig"

          test -s "dist/${appimage}"
          test -s "${signature}"

          encoded_tag="$(jq -rn --arg value "${TAG}" '$value | @uri')"
          encoded_asset="$(jq -rn --arg value "${appimage}" '$value | @uri')"
          download_url="https://github.com/${REPOSITORY}/releases/download/${encoded_tag}/${encoded_asset}"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          jq -n \
            --arg version "${actual_version}" \
            --arg notes "Harbor Linux ${CHANNEL} updater test build." \
            --arg pub_date "${published_at}" \
            --arg url "${download_url}" \
            --rawfile signature "${signature}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "linux-x86_64": {
                  url: $url,
                  signature: ($signature | gsub("\\s+$"; ""))
                }
              }
            }' > dist/latest.json

          jq -e '
            (.version | type == "string" and length > 0) and
            (.platforms["linux-x86_64"].url | startswith("https://")) and
            (.platforms["linux-x86_64"].signature | length > 0)
          ' dist/latest.json >/dev/null

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage-${{ steps.package.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Attach AppImage assets to release
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-24.04
    concurrency:
      group: harbor-release-assets-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download AppImage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appimage-${{ needs.build.outputs.version }}
          path: dist

      - name: Update checksums and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          checksums="SHA256SUMS-${VERSION}.txt"
          gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null
          release_info="$(gh release view "${TAG}" \
            --repo "${REPOSITORY}" \
            --json assets)"

          if jq -e --arg name "${checksums}" \
            'any(.assets[]; .name == $name)' \
            <<< "${release_info}" >/dev/null; then
            gh release download "${TAG}" \
              --repo "${REPOSITORY}" \
              --pattern "${checksums}" \
              --dir dist
          elif jq -e '.assets | length == 0' \
            <<< "${release_info}" >/dev/null; then
            : > "dist/${checksums}"
          else
            echo "Release ${TAG} has assets but no ${checksums}; refusing to replace incomplete checksums." >&2
            exit 1
          fi

          tmpfile="$(mktemp)"
          trap 'rm -f "${tmpfile}"' EXIT
          awk '!/  (dist\/|\.\/)?Harbor_.*_amd64\.AppImage(\.zsync|\.sig)?$/' \
            "dist/${checksums}" > "${tmpfile}"

          (
            cd dist
            sha256sum -- *.AppImage *.AppImage.zsync *.AppImage.sig
          ) >> "${tmpfile}"

          sort -k 2,2 "${tmpfile}" > "dist/${checksums}"

          gh release upload "${TAG}" \
            dist/*.AppImage \
            dist/*.AppImage.zsync \
            dist/*.AppImage.sig \
            "dist/${checksums}" \
            --repo "${REPOSITORY}" \
            --clobber

      - name: Publish test update feed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          case "${CHANNEL}" in
            stable|beta) ;;
            *)
              echo "Unsupported update channel: ${CHANNEL}" >&2
              exit 1
              ;;
          esac

          test -s dist/latest.json
          feed_tag="updater-test-${CHANNEL}"

          gh release view "${feed_tag}" \
            --repo "${REPOSITORY}" >/dev/null

          appimage="$(jq -er '.artifacts[0]' dist/build-manifest.json)"
          case "${appimage}" in
            Harbor_*_amd64.AppImage) ;;
            *)
              echo "Unexpected AppImage filename: ${appimage}" >&2
              exit 1
              ;;
          esac

          test -s "dist/${appimage}"
          test -s "dist/${appimage}.sig"
          test -s "dist/${appimage}.zsync"

          gh release upload "${feed_tag}" \
            "dist/${appimage}" \
            "dist/${appimage}.sig" \
            --repo "${REPOSITORY}" \
            --clobber

          gh release upload "${feed_tag}" \
            "dist/${appimage}.zsync" \
            --repo "${REPOSITORY}" \
            --clobber

          stale_zsync="$(gh release view "${feed_tag}" \
            --repo "${REPOSITORY}" \
            --json assets |
            jq -r --arg current "${appimage}.zsync" '
              .assets[].name
              | select(test("^Harbor_.*_amd64\\.AppImage\\.zsync$"))
              | select(. != $current)
            ')"

          while IFS= read -r asset; do
            [ -n "${asset}" ] || continue
            gh release delete-asset "${feed_tag}" "${asset}" \
              --repo "${REPOSITORY}" \
              --yes
          done <<< "${stale_zsync}"

          gh release upload "${feed_tag}" \
            dist/latest.json \
            --repo "${REPOSITORY}" \
            --clobber
